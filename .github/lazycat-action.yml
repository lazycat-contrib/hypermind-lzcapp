version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/hypermind.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: hypermind

build:
  run_buildscript: false

images:
  - id: hypermind
    target: service
    service: hypermind
    source: ghcr.io/lklynet/hypermind
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: HyperMind
    summary: "一个完全去中心化的点对点部署计数器和临时聊天平台"
